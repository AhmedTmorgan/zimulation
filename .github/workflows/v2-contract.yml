name: v2 scientific contract

# The contract is only real if it fails the build. Runs on every push.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scientific contract
        run: python -m tests.v2.test_contract
      - name: Determinism and observer isolation
        run: python -m tests.v2.test_determinism
      - name: World physics
        run: python -m tests.v2.test_physics
      - name: Physiology
        run: python -m tests.v2.test_physiology
      - name: Genetics
        run: python -m tests.v2.test_genetics
      - name: Development and reproduction
        run: python -m tests.v2.test_development
      - name: Cognition
        run: python -m tests.v2.test_cognition
      - name: Causal inference
        run: python -m tests.v2.test_causal
      - name: Concepts
        run: python -m tests.v2.test_concepts
      - name: Primitives
        run: python -m tests.v2.test_primitives
      - name: Thermal
        run: python -m tests.v2.test_thermal
      - name: Skills
        run: python -m tests.v2.test_skills
      - name: Planning
        run: python -m tests.v2.test_planning
      - name: Climate
        run: python -m tests.v2.test_climate
